<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MODEC SPEECH MANAGER</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <h1>MODEC SPEECH MANAGER</h1>

  <!-- Country Speaking Section -->
  <button onclick="toggleSection('countrySection')"> Commision</button>
  <div id="countrySection" class="section">
    <label>Select Country:</label>
    <select id="countrySelect" onchange="updateFlag()">
      <option value="id">Indonesia</option>
      <option value="tr">Turkey</option>
      <option value="ng">Nigeria</option>
    </select>

    <!-- Flag Display -->
    <div id="flagDisplay" class="flag-display">
      <img id="flagImage" src="" alt="Flag"/>
    </div>

    <label>Set Time (minutes):</label>
    <input type="number" id="countryTimeInput" min="1" />

    <button onclick="startTimer('country')">▶️ Start</button>
    <button onclick="pauseTimer('country')">⏸ Pause</button>
    <button onclick="resumeTimer('country')">▶ Resume</button>

    <div id="countryTimerDisplay">Time Left: 0:00</div>
  </div>

  <!-- Admin Reason Section -->
  <button onclick="toggleSection('reasonSection')">Council</button>
  <div id="reasonSection" class="section">
    <textarea id="adminReason" placeholder="Reason for speech..."></textarea>
    <input type="number" id="reasonTimeInput" placeholder="Time Limit (minutes)" />

    <button onclick="startTimer('reason')">▶️ Start</button>
    <button onclick="pauseTimer('reason')">⏸ Pause</button>
    <button onclick="resumeTimer('reason')">▶ Resume</button>

    <div id="reasonTimerDisplay">Time Left: 0:00</div>
  </div>

  <!-- Final Admin Section -->
  <button onclick="toggleSection('finalSection')">Summit</button>
  <div id="finalSection" class="section">
    <textarea id="finalCountries" placeholder="Countries Speaking..."></textarea>
    <input type="number" id="finalTimeInput" placeholder="Time Limit (minutes)" />

    <button onclick="startTimer('final')">▶️ Start</button>
    <button onclick="pauseTimer('final')">⏸ Pause</button>
    <button onclick="resumeTimer('final')">▶ Resume</button>

    <div id="finalTimerDisplay">Time Left: 0:00</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
